name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Demandée par rejeu-main.yml après une fusion automatique (voir ce fichier).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Un test qui boucle ne doit pas bloquer la fusion pendant des heures.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      # Ni paquet venu d'un registre ou d'un dépôt git, ni .cargo/ (son runner ferait passer cargo test sans test).
      - name: sans dépendance ni .cargo/
        if: runner.os == 'Linux'
        run: |
          test ! -e .cargo
          venus=$(cargo metadata --format-version 1 --locked | jq '[.packages[] | select(.source != null)] | length')
          test "$venus" = 0
      - run: cargo fmt --check
      # Sans arrêt au premier échec : la CI montre tous les tests rouges d'un coup.
      - run: cargo test --no-fail-fast
      - run: cargo clippy --all-targets -- -D warnings
